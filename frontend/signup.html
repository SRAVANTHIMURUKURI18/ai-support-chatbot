<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT Helpdesk - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h2 class="brand-logo">VIT<span>helpdesk</span></h2>
        <p class="subtitle">Create Student Account</p>
        
        <form id="signupForm">
            <div class="form-group">
                <label>College Email ID</label>
                <input type="email" id="signupEmail" placeholder="student@vishnu.edu.in" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create Password" required>
            </div>
            <button type="submit" class="auth-btn">Register</button>
        </form>
        
        <p class="auth-switch">Already have an account? <a href="index.html">Sign In</a></p>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            try {
                const res = await fetch('http://127.0.0.1:8000/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Signup failed');

                alert('Registration successful! Please sign in.');
                window.location.href = 'index.html';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
