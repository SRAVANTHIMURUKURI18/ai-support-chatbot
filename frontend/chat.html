<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIThelpdesk Assistant</title>
    <script>
        const storedTheme = localStorage.getItem('vit_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', storedTheme);
    </script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --sidebar-bg: #242424;
            --text-color: #f0f0f0;
            --card-bg: #2d2d2d;
            --border-color: #383838;
            --input-bg: #1a1a1a;
            --bot-msg-bg: #2d2d2d;
            --secondary-btn: #333;
            --secondary-hover: #444;
            --secondary-text: #ddd;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f9;
            --sidebar-bg: #ffffff;
            --text-color: #333333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --bot-msg-bg: #e9ecef;
            --secondary-btn: #e4e6eb;
            --secondary-hover: #d8dadf;
            --secondary-text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 8px;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
            transition: background 0.3s, border-color 0.3s;
        }
        .profile-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 5px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s, border-color 0.3s;
        }
        .profile-card:hover {
            transform: scale(1.02);
            border-color: #ff4d4d;
        }
        .profile-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff4d4d, #b30000);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.3);
        }
        .profile-card h3 {
            margin: 0 0 2px 0;
            color: #ff4d4d;
            font-size: 14px;
        }
        .profile-card p {
            margin: 2px 0;
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.8;
            word-break: break-all;
        }
        .ticket-badge {
            margin-top: 6px;
            background-color: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }
        .sidebar button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            text-align: left;
            transition: background 0.2s;
        }
        .sidebar button:hover {
            background-color: #e03b3b;
        }
        .sidebar button.secondary {
            background-color: var(--secondary-btn);
            color: var(--secondary-text);
        }
        .sidebar button.secondary:hover {
            background-color: var(--secondary-hover);
        }

        /* Search Section in Sidebar */
        .sidebar-search-container {
            position: relative;
            margin-bottom: 5px;
        }
        .sidebar-search-container input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 13px;
            box-sizing: border-box;
        }
        .sidebar-search-container input:focus {
            outline: none;
            border-color: #ff4d4d;
        }
        .search-results-dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .search-result-item {
            padding: 10px 12px;
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .search-result-item:hover {
            background-color: rgba(255, 77, 77, 0.1);
        }

        /* Modal Popup Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .ticket-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .ticket-item:hover {
            border-color: #ff4d4d;
        }
        .ticket-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
        }
        .resolve-action-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            align-self: flex-end;
            margin-top: 5px;
        }
        .resolve-action-btn:hover { background-color: #218838; }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            height: 100vh;
        }
        .chat-header {
            padding: 15px 25px;
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .export-select {
            background-color: var(--secondary-btn);
            color: var(--secondary-text);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: background 0.2s;
        }
        .export-select:hover {
            background-color: var(--secondary-hover);
        }

        .logo-vit {
            color: #ff4d4d;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .logo-helpdesk {
            color: var(--text-color);
            font-style: italic;
            font-weight: 400;
            opacity: 0.9;
        }
        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .message.user {
            background-color: #ff4d4d;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            background-color: var(--bot-msg-bg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .suggested-actions {
            padding: 10px 25px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }
        .suggested-actions button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.2s, background 0.2s;
        }
        .suggested-actions button:hover {
            border-color: #ff4d4d;
            background-color: rgba(255, 77, 77, 0.05);
        }
        .chat-input-area {
            padding: 20px;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .chat-input-area textarea {
            flex: 1;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }
        .chat-input-area textarea:focus {
            outline: none;
            border-color: #ff4d4d;
        }
        .send-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .send-btn:hover:not(:disabled) {
            background-color: #e03b3b;
        }
        .send-btn:disabled {
            background-color: var(--secondary-btn);
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="profile-card" onclick="openProfilePage()" title="Click to open full profile page">
            <div class="profile-avatar" id="profile-initials">SM</div>
            <h3 id="student-name">Student Portal</h3>
            <p id="student-email">Loading...</p>
            <div class="ticket-badge" id="active-tickets-badge">Active Tickets: Loading...</div>
        </div>

        <!-- Live FAQ Search Bar -->
        <div class="sidebar-search-container">
            <input type="text" id="faqSearchInput" placeholder="🔍 Search campus FAQs..." oninput="searchFAQs(this.value)">
            <div id="searchResultsDropdown" class="search-results-dropdown"></div>
        </div>

        <button onclick="scrollToBottom()">💬 Active Chat</button>
        <button onclick="startNewChat()">✨ New Chat</button>
        <button onclick="sendQuickCommand('menu')" class="secondary">🏠 Main Menu</button>
        <button onclick="sendQuickCommand('create ticket')" class="secondary">🎫 Create Support Ticket</button>
        <button onclick="openTicketsModal()" class="secondary">📋 Manage My Tickets</button>
        <button onclick="sendQuickCommand('smart campus outing process')" class="secondary">🚶 Smart Campus Outing</button>
        <button onclick="sendQuickCommand('facilities')" class="secondary">🏢 Facilities</button>
        <button onclick="sendQuickCommand('eapcet info')" class="secondary">📊 EAPCET Cutoff Info</button>
        <button onclick="sendQuickCommand('explore campus clubs & join')" class="secondary">🌟 Explore Clubs</button>
        <button onclick="toggleTheme()" class="secondary" id="theme-toggle-btn">☀️ Light Mode</button>
        <button onclick="logout()" class="secondary" style="margin-top: auto; color: #ff6b6b; font-weight: bold;">🚪 Logout</button>
    </div>

    <!-- Enhanced Modal for Tickets & Comments Thread -->
    <div class="modal-overlay" id="ticketsModal">
        <div class="modal-card">
            <div id="ticketListView">
                <h3 style="margin-top:0; color:#ff4d4d; font-size:18px;">Active Support Tickets</h3>
                <p style="font-size:12px; color:var(--secondary-text); margin-bottom:15px;">Click a ticket to view conversation history or add comments.</p>
                <div id="modalTicketList" style="display: flex; flex-direction: column; gap: 10px;">
                    <p style="color:#888; text-align:center;">Loading active tickets...</p>
                </div>
            </div>

            <!-- Ticket Thread View (Hidden by default) -->
            <div id="ticketThreadView" style="display: none;">
                <button onclick="backToTicketList()" style="background:var(--secondary-btn); border:none; color:var(--text-color); padding:6px 12px; border-radius:6px; cursor:pointer; margin-bottom:10px;">← Back to Tickets</button>
                <h3 id="threadTitle" style="color:#ff4d4d; margin:5px 0; font-size:16px;">Ticket Thread</h3>
                <div id="threadMessages" style="background:var(--bg-color); border:1px solid var(--border-color); border-radius:10px; padding:10px; height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px;"></div>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="commentInput" placeholder="Type a reply or update..." style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-color);">
                    <button onclick="postComment()" style="background:#ff4d4d; color:white; border:none; padding:0 16px; border-radius:8px; cursor:pointer; font-weight:bold;">Send</button>
                </div>
            </div>

            <button onclick="closeTicketsModal()" style="background:var(--secondary-btn); color:var(--text-color); border:none; padding:10px; border-radius:10px; width:100%; margin-top:15px; cursor:pointer; font-weight:600;">Close</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-brand">
                <span class="logo-vit">VIT</span><span class="logo-helpdesk">helpdesk</span>
            </div>
            <div class="header-actions">
                <select id="exportDropdown" class="export-select" onchange="handleExportSelection(this)">
                    <option value="" disabled selected>📥 Export Chat...</option>
                    <option value="txt">Export as Text (.txt)</option>
                    <option value="pdf">Export as PDF</option>
                </select>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <!-- Suggested Quick Actions Bar -->
        <div class="suggested-actions">
            <button onclick="sendQuickCommand('menu')">🏠 Main Menu</button>
            <button onclick="sendQuickCommand('college info')">📚 College Info</button>
            <button onclick="sendQuickCommand('my tickets')">🔍 My Tickets</button>
            <button onclick="sendQuickCommand('placement statistics')">📈 Placements</button>
        </div>

        <div class="chat-input-area">
            <textarea id="user-input" placeholder="Type your message or select an option..." rows="1" onkeypress="handleKeyPress(event)"></textarea>
            <button id="sendBtn" class="send-btn" onclick="sendMessage()" title="Send Message" disabled>
                <!-- Send Icon SVG -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('vit_theme') || 'dark';
            const btn = document.getElementById('theme-toggle-btn');
            if(btn) btn.innerText = currentTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('vit_theme', newTheme);
            document.getElementById('theme-toggle-btn').innerText = newTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
        }

        // Robust Student Email Verification with Fallback
        let studentEmail = localStorage.getItem('student_email') || localStorage.getItem('vit_email') || localStorage.getItem('email');
        if (!studentEmail || studentEmail === 'undefined' || studentEmail === 'null') {
            studentEmail = '23pa1a05g1@vishnu.edu.in';
            localStorage.setItem('student_email', studentEmail);
        }

        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('sendBtn');

        // Input auto-resize and send button state handler
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function refreshProfileData() {
            fetch(`http://127.0.0.1:8000/api/profile/${encodeURIComponent(studentEmail)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('student-name').innerText = data.name;
                    document.getElementById('student-email').innerText = data.email;
                    document.getElementById('active-tickets-badge').innerText = `Active Tickets: ${data.active_tickets}`;
                    
                    const nameParts = data.name.trim().split(' ');
                    let initials = nameParts[0][0];
                    if (nameParts.length > 1) {
                        initials += nameParts[nameParts.length - 1][0];
                    }
                    document.getElementById('profile-initials').innerText = initials.toUpperCase();
                })
                .catch(err => console.error("Error fetching profile:", err));
        }

        refreshProfileData();

        // Load Session Storage Chat History
        const savedSessionHistory = sessionStorage.getItem('vit_chat_session_' + studentEmail);
        if (savedSessionHistory) {
            chatMessages.innerHTML = savedSessionHistory;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        } else {
            triggerBotMessage("menu");
        }

        function startNewChat() {
            chatMessages.innerHTML = '';
            sessionStorage.removeItem('vit_chat_session_' + studentEmail);
            triggerBotMessage("menu");
        }

        function openProfilePage() {
            window.location.href = 'profile.html';
        }

        // Live FAQ Search Bar Handler
        function searchFAQs(query) {
            const dropdown = document.getElementById('searchResultsDropdown');
            if (!query || query.trim() === '') {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }

            fetch(`http://127.0.0.1:8000/api/search?query=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    dropdown.innerHTML = '';
                    if (!data.results || data.results.length === 0) {
                        dropdown.style.display = 'block';
                        dropdown.innerHTML = '<div class="search-result-item" style="color:#888;">No matching questions found</div>';
                        return;
                    }

                    dropdown.style.display = 'block';
                    data.results.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        div.innerHTML = `<strong>${item.question}</strong>`;
                        div.onclick = () => {
                            dropdown.style.display = 'none';
                            document.getElementById('faqSearchInput').value = '';
                            callBackend(item.question);
                        };
                        dropdown.appendChild(div);
                    });
                })
                .catch(err => console.error("Search error:", err));
        }

        // Close search dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const searchContainer = document.querySelector('.sidebar-search-container');
            if (searchContainer && !searchContainer.contains(e.target)) {
                document.getElementById('searchResultsDropdown').style.display = 'none';
            }
        });

        // Dropdown Export Handler for TXT or PDF
        function handleExportSelection(selectElement) {
            const format = selectElement.value;
            if (!format) return;

            if (!chatMessages || chatMessages.innerText.trim() === "") {
                alert("No chat history to export!");
                selectElement.value = "";
                return;
            }

            if (format === 'txt') {
                let transcript = "--- VISHNU IT HELPDESK CHAT TRANSCRIPT ---\n\n" + chatMessages.innerText;
                const blob = new Blob([transcript], { type: "text/plain;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "vishnu_helpdesk_transcript.txt";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            } else if (format === 'pdf') {
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <html>
                        <head>
                            <title>Vishnu IT Helpdesk - Chat Transcript</title>
                            <style>
                                body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; color: #333; }
                                h2 { color: #ff4d4d; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
                                .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 14px; max-width: 80%; }
                                .user { background-color: #ffe6e6; color: #b30000; margin-left: auto; text-align: right; border-left: 4px solid #ff4d4d; }
                                .bot { background-color: #f4f6f9; color: #333; margin-right: auto; border-left: 4px solid #333; }
                            </style>
                        </head>
                        <body>
                            <h2>Vishnu IT Helpdesk :: Chat Transcript</h2>
                            <div>${chatMessages.innerHTML}</div>
                            <script>
                                window.onload = function() {
                                    window.print();
                                    window.close();
                                };
                            <\/script>
                        </body>
                    </html>
                `);
                printWindow.document.close();
            }

            selectElement.value = "";
        }

        // Modal Ticket Functions & Thread Management
        let activeSelectedTicketId = null;

        function openTicketsModal() {
            document.getElementById('ticketThreadView').style.display = 'none';
            document.getElementById('ticketListView').style.display = 'block';
            document.getElementById('ticketsModal').style.display = 'flex';
            loadModalTickets();
        }

        function closeTicketsModal() {
            document.getElementById('ticketsModal').style.display = 'none';
        }

        function loadModalTickets() {
            const listContainer = document.getElementById('modalTicketList');
            listContainer.innerHTML = '<p style="color:#888; text-align:center;">Loading active tickets...</p>';

            fetch(`http://127.0.0.1:8000/api/tickets/${encodeURIComponent(studentEmail)}`)
                .then(res => res.json())
                .then(tickets => {
                    listContainer.innerHTML = '';
                    
                    const activeTickets = tickets.filter(t => t.status !== 'Resolved' && t.status !== 'Closed');

                    if (!activeTickets || activeTickets.length === 0) {
                        listContainer.innerHTML = '<p style="color:#888; text-align:center;">No active support tickets found.</p>';
                        return;
                    }

                    activeTickets.forEach(t => {
                        const item = document.createElement('div');
                        item.className = 'ticket-item';
                        item.onclick = () => openTicketThread(t.id, t.category, t.description);

                        item.innerHTML = `
                            <div class="ticket-top">
                                <strong style="font-size:14px; color:var(--text-color);">Ticket #${t.id} &bull; ${t.category}</strong>
                                <span class="status-pill">${t.status}</span>
                            </div>
                            <p style="margin:4px 0; font-size:13px; color:var(--secondary-text);">${t.description}</p>
                            <button class="resolve-action-btn" onclick="event.stopPropagation(); resolveTicket(${t.id})">✔ Mark as Resolved</button>
                        `;
                        listContainer.appendChild(item);
                    });
                })
                .catch(err => {
                    listContainer.innerHTML = '<p style="color:#ff4d4d; text-align:center;">Failed to load tickets.</p>';
                    console.error(err);
                });
        }

        function openTicketThread(ticketId, category, desc) {
            activeSelectedTicketId = ticketId;
            document.getElementById('ticketListView').style.display = 'none';
            document.getElementById('ticketThreadView').style.display = 'block';
            document.getElementById('threadTitle').innerText = `Ticket #${ticketId} • ${category}`;
            loadThreadMessages(ticketId);
        }

        function backToTicketList() {
            document.getElementById('ticketThreadView').style.display = 'none';
            document.getElementById('ticketListView').style.display = 'block';
            loadModalTickets();
        }

        function loadThreadMessages(ticketId) {
            const container = document.getElementById('threadMessages');
            container.innerHTML = '<p style="color:var(--secondary-text); text-align:center; font-size:12px;">Loading comments...</p>';

            fetch(`http://127.0.0.1:8000/api/tickets/${ticketId}/comments`)
                .then(res => res.json())
                .then(comments => {
                    container.innerHTML = '';
                    if (!comments || comments.length === 0) {
                        container.innerHTML = '<p style="color:var(--secondary-text); text-align:center; font-size:12px;">No conversation notes yet. Add a message below!</p>';
                        return;
                    }
                    comments.forEach(c => {
                        const msgDiv = document.createElement('div');
                        msgDiv.style.padding = '10px 14px';
                        msgDiv.style.borderRadius = '10px';
                        msgDiv.style.fontSize = '13px';
                        msgDiv.style.maxWidth = '80%';
                        msgDiv.style.wordBreak = 'break-word';
                        
                        if (c.sender === 'student') {
                            msgDiv.style.background = '#ff4d4d';
                            msgDiv.style.color = '#ffffff';
                            msgDiv.style.alignSelf = 'flex-end';
                        } else {
                            msgDiv.style.background = 'var(--secondary-btn)';
                            msgDiv.style.color = 'var(--text-color)';
                            msgDiv.style.alignSelf = 'flex-start';
                        }
                        
                        msgDiv.innerHTML = `<strong style="display:block; font-size:10px; opacity:0.8; margin-bottom:2px;">${c.sender.toUpperCase()}</strong> ${c.message}`;
                        container.appendChild(msgDiv);
                    });
                    container.scrollTop = container.scrollHeight;
                })
                .catch(err => {
                    container.innerHTML = '<p style="color:#ff4d4d; text-align:center; font-size:12px;">Failed to load comments.</p>';
                    console.error(err);
                });
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text || !activeSelectedTicketId) return;

            fetch(`http://127.0.0.1:8000/api/tickets/${activeSelectedTicketId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: 'student', message: text })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    input.value = '';
                    loadThreadMessages(activeSelectedTicketId);
                }
            });
        }

        function resolveTicket(ticketId) {
            fetch(`http://127.0.0.1:8000/api/tickets/${ticketId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'Resolved' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadModalTickets();
                    refreshProfileData();
                } else {
                    alert('Failed to update ticket status.');
                }
            })
            .catch(err => console.error(err));
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (!sendBtn.disabled) {
                    sendMessage();
                }
            }
        }

        function sendQuickCommand(cmd) {
            callBackend(cmd);
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;
            callBackend(text);
        }

        function triggerBotMessage(text) {
            callBackend(text);
        }

        function callBackend(messageText) {
            appendMessageUI(messageText, "user");

            fetch('http://127.0.0.1:8000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: studentEmail, message: messageText })
            })
            .then(res => res.json())
            .then(data => {
                appendMessageUI(data.response, "bot");
                refreshProfileData();
            })
            .catch(err => {
                appendMessageUI("⚠️ Error connecting to server.", "bot");
                console.error(err);
            });
        }

        function appendMessageUI(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            
            let formattedText = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            div.innerHTML = formattedText;
            
            if (sender === 'bot') {
                const feedbackDiv = document.createElement('div');
                feedbackDiv.style.marginTop = '8px';
                feedbackDiv.style.fontSize = '12px';
                feedbackDiv.innerHTML = `
                    <span style="color: #888; margin-right: 8px;">Helpful?</span>
                    <button onclick="sendFeedback('Helpful')" style="background:none; border:none; cursor:pointer;">👍</button>
                    <button onclick="sendFeedback('Not Helpful')" style="background:none; border:none; cursor:pointer;">👎</button>
                `;
                div.appendChild(feedbackDiv);
            }

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            sessionStorage.setItem('vit_chat_session_' + studentEmail, chatMessages.innerHTML);
        }

        function sendFeedback(rating) {
            alert("Thank you for your feedback (" + rating + ")!");
        }

        function logout() {
            sessionStorage.clear();
            localStorage.removeItem('student_email');
            localStorage.removeItem('vit_email');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
