<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT Helpdesk Chatbot</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        if (localStorage.getItem('vit_logged_in') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <h2>VIT<span>helpdesk</span></h2>
                <div class="header-actions">
                    <a href="profile.html" class="icon-btn" title="View Profile">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </a>
                </div>
            </div>
        </header>

        <main id="chatWindow">
            <!-- Instantly rendered initial menu - zero network delay -->
            <div class="message ai-message">
                <div class="avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect></svg>
                </div>
                <div class="bubble" style="white-space: pre-wrap;">Welcome to Vishnu Institute of Technology IT Helpdesk! Please select an option below:

1️⃣ **Create a Support Ticket**
2️⃣ **Retrieve College Info**
3️⃣ **Display Active Tickets**
4️⃣ **Reset Portal Password**</div>
            </div>
        </main>

        <div class="input-area">
            <div class="suggestion-chips">
                <button class="chip" onclick="sendSuggested('College Info')">College Info</button>
                <button class="chip" onclick="sendSuggested('EAMCET details')">EAMCET Info</button>
                <button class="chip" onclick="sendSuggested('Create a ticket')">Create Ticket</button>
                <button class="chip" onclick="sendSuggested('Show My Tickets')">My Tickets</button>
            </div>
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Type a message or click an option..."></textarea>
                <button id="sendBtn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const userEmail = localStorage.getItem('vit_email') || 'student@vishnu.edu.in';

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });
        sendBtn.disabled = true;

        function sendSuggested(text) {
            userInput.value = text;
            userInput.style.height = 'auto';
            sendBtn.disabled = false;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            const loadingId = appendLoading();

            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `[User Email: ${userEmail}] ${text}`, 
                        session_id: userEmail 
                    })
                });

                if (!response.ok) throw new Error('Backend offline');

                const data = await response.json();
                document.getElementById(loadingId).remove();
                appendMessage('ai', data.reply);

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('ai', 'Error: Could not connect to backend server. Make sure python main.py is running.');
            }
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            const aiAvatar = `<div class="avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect></svg></div>`;
            
            messageDiv.innerHTML = `${isUser ? '' : aiAvatar}<div class="bubble" style="white-space: pre-wrap;">${escapeHTML(text)}</div>`;
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ai-message`;
            messageDiv.id = id;
            messageDiv.innerHTML = `<div class="avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect></svg></div><div class="bubble">Processing...</div>`;
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
            return id;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendMessage();
            }
        });
        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>
</html>
