<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT Helpdesk - Smart Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Force strict full-screen viewport layout */
        html, body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .chat-header {
            flex-shrink: 0;
            height: 65px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-light);
            z-index: 100;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 65px);
            max-width: 100% !important;
            width: 100% !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            overflow: hidden;
        }

        .chat-box {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto !important;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-color);
        }

        .quick-replies {
            flex-shrink: 0;
            padding: 10px 40px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            z-index: 50;
        }

        .chat-input-area {
            flex-shrink: 0;
            padding: 15px 40px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 50;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 14px;
        }

        .chat-input-area button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="chat-header">
            <h2 class="brand-logo" id="logoClick" style="cursor:pointer; margin:0;">VIT<span>helpdesk</span></h2>
            <div class="header-controls">
                <button type="button" id="darkToggleBtn" class="dark-toggle-btn">🌙 Dark Mode</button>
                <div class="profile-icon-btn" id="profileBtn" title="Student Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
        </header>

        <main class="chat-container">
            <div class="chat-box" id="chatMessages">
                <div class="message bot">Welcome to Vishnu Institute of Technology IT Helpdesk! Please select an option below:

1️⃣ **Create a Support Ticket**
2️⃣ **Retrieve College Info**
3️⃣ **Display Active Tickets**
4️⃣ **Reset Portal Password**
5️⃣ **Explore Campus Clubs & Join**</div>
            </div>

            <div class="quick-replies">
                <button type="button" class="quick-btn" data-text="College Info">College Info</button>
                <button type="button" class="quick-btn" data-text="EAPCET Info">EAPCET Info</button>
                <button type="button" class="quick-btn" data-text="Create Ticket">Create Ticket</button>
                <button type="button" class="quick-btn" data-text="My Tickets">My Tickets</button>
                <button type="button" class="quick-btn" data-text="menu">Menu</button>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type a message or select an option..." autocomplete="off">
                <button type="button" id="sendBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </main>
    </div>

    <script>
        const studentEmail = localStorage.getItem('student_email') || localStorage.getItem('vit_email') || "23pa1a05g1@vishnu.edu.in";
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        document.addEventListener('DOMContentLoaded', () => {
            const savedChat = localStorage.getItem('chat_history_' + studentEmail);
            if (savedChat) {
                chatMessages.innerHTML = savedChat;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            if (localStorage.getItem('dark_mode') === 'true') {
                document.body.classList.add('dark-mode');
                const btn = document.getElementById('darkToggleBtn');
                if (btn) btn.innerText = "☀️ Light Mode";
            }

            document.getElementById('logoClick').addEventListener('click', () => {
                window.location.href = 'chat.html';
            });

            document.getElementById('profileBtn').addEventListener('click', () => {
                window.location.href = 'profile.html';
            });

            document.getElementById('darkToggleBtn').addEventListener('click', toggleDarkMode);
            document.getElementById('sendBtn').addEventListener('click', sendMessage);

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const text = btn.getAttribute('data-text');
                    chatInput.value = text;
                    sendMessage();
                });
            });
        });

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            chatInput.value = '';

            const processingId = appendMessage('Processing...', 'bot');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        session_id: studentEmail
                    })
                });
                const data = await response.json();
                const procElement = document.getElementById(processingId);
                if (procElement) procElement.remove();
                
                appendMessage(data.response || data.message || "Action completed.", 'bot');
                localStorage.setItem('chat_history_' + studentEmail, chatMessages.innerHTML);
            } catch (err) {
                const procElement = document.getElementById(processingId);
                if (procElement) procElement.remove();
                appendMessage('Error connecting to server. Please try again.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.id = 'msg-' + Math.random().toString(36).substring(2, 9);
            div.innerText = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            localStorage.setItem('chat_history_' + studentEmail, chatMessages.innerHTML);
            return div.id;
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('darkToggleBtn');
            if (document.body.classList.contains('dark-mode')) {
                btn.innerText = "☀️ Light Mode";
                localStorage.setItem('dark_mode', 'true');
            } else {
                btn.innerText = "🌙 Dark Mode";
                localStorage.setItem('dark_mode', 'false');
            }
        }
    </script>
</body>
</html>
