<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT Helpdesk - Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="chat-header">
            <h2 class="brand-logo" onclick="window.location.href='chat.html'" style="cursor:pointer; margin:0;">VIT<span>helpdesk</span></h2>
            <a href="chat.html" class="nav-link">Back to Chat</a>
        </header>

        <main class="profile-main">
            <div class="profile-card">
                <div class="avatar-large" id="avatarInitials">SM</div>
                <h3 id="profileName">Loading...</h3>
                <p class="text-muted" id="profileBranch">Loading...</p>
                
                <div class="profile-stats">
                    <div class="stat-box">
                        <span class="stat-number" id="activeTickets">0</span>
                        <span class="stat-label">Active Tickets</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number" id="resolvedTickets">0</span>
                        <span class="stat-label">Resolved</span>
                    </div>
                </div>

                <div class="profile-details">
                    <p><strong>Roll Number:</strong> <span id="profileRoll">-</span></p>
                    <p><strong>College Email:</strong> <span id="profileEmail">-</span></p>
                </div>

                <hr style="border:0; border-top:1px solid var(--border-light); margin: 1.5rem 0;">

                <h4>Reset Portal Password</h4>
                <form id="resetForm">
                    <div class="form-group" style="margin-bottom: 8px;">
                        <input type="password" id="oldPassword" placeholder="Current Password" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <input type="password" id="newPassword" placeholder="New Password" required>
                    </div>
                    <button type="submit" class="auth-btn">Update Password</button>
                </form>

                <button class="auth-btn logout-btn" onclick="handleLogout()">Sign Out</button>
            </div>
        </main>
    </div>

    <script>
        const email = localStorage.getItem('vit_email') || localStorage.getItem('student_email');
        
        async function loadProfile() {
            if (!email) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch(`http://127.0.0.1:8000/api/profile/${encodeURIComponent(email)}`);
                const data = await res.json();
                if (!res.ok) throw new Error('Failed to load profile');

                document.getElementById('profileName').innerText = data.name || "Sravanthi Murukuri";
                document.getElementById('profileBranch').innerText = data.branch_year || "CSE - 4TH YEAR";
                document.getElementById('profileRoll').innerText = data.roll_number || email.split('@')[0].toUpperCase();
                document.getElementById('profileEmail').innerText = data.email || email;
                
                document.getElementById('activeTickets').innerText = data.active_tickets ?? 2;
                document.getElementById('resolvedTickets').innerText = data.resolved_tickets ?? 0;
                
                const nameStr = data.name || "Sravanthi Murukuri";
                const initials = nameStr.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                document.getElementById('avatarInitials').innerText = initials;
            } catch (err) {
                console.error('Error loading profile data:', err);
                document.getElementById('profileEmail').innerText = email;
                document.getElementById('profileName').innerText = "Sravanthi Murukuri";
                document.getElementById('profileBranch').innerText = "CSE - 4TH YEAR";
                document.getElementById('profileRoll').innerText = email.split('@')[0].toUpperCase();
            }
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const old_password = document.getElementById('oldPassword').value;
            const new_password = document.getElementById('newPassword').value;

            try {
                const res = await fetch('http://127.0.0.1:8000/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, old_password, new_password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Password update failed');

                alert('Password updated successfully!');
                document.getElementById('resetForm').reset();
            } catch (err) {
                alert(err.message);
            }
        });

        function handleLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        loadProfile();
    </script>
</body>
</html>
